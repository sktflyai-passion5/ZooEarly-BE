name: build

# PR과 main 푸시에서만 돈다. 이 서버는 무상태 게이트웨이라 DB·외부 서비스 없이 빌드/테스트가 끝난다
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'          # build.gradle의 toolchain과 맞춘다
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon
